# Nightly builds of mGBA-qt with this fork's rollback netplay (USE_NETPLAY), for
# Linux (AppImage), Windows (zip) and macOS (zipped app), published as the rolling
# "nightly" pre-release.
#
#   - The schedule runs once a night and builds only when the default branch has
#     moved since the commit that the "nightly" tag points to.
#   - A manual run (workflow_dispatch) always builds. It publishes only when it
#     runs on the default branch; on any other branch it just builds.
name: nightly

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [ claude/nakama-matchmaker-dedicated-server-el209s ]

permissions:
  contents: read

concurrency:
  group: nightly

jobs:
  check:
    name: Check for new commits
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Compare the nightly tag with this commit
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != schedule ]; then
            echo "A $EVENT run always builds."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An annotated tag lists the commit it points to as refs/tags/nightly^{}.
          tagged="$(git ls-remote --tags origin 'refs/tags/nightly*' | awk '
            $2 == "refs/tags/nightly" { tag = $1 }
            $2 == "refs/tags/nightly^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : tag) }')"
          echo "nightly tag: ${tagged:-none}; this commit: $GITHUB_SHA"
          if [ "$tagged" = "$GITHUB_SHA" ]; then
            echo "No new commits since the last nightly build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: Linux x86_64 (AppImage)
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-dev-tools libqt6opengl6-dev qt6-multimedia-dev \
            qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools qt6-wayland libgl-dev \
            libsdl2-dev libzip-dev zipcmp zipmerge ziptool libedit-dev libelf-dev libepoxy-dev \
            libpng-dev zlib1g-dev libsqlite3-dev liblua5.4-dev libjson-c-dev libfreetype-dev \
            libfuse2 xvfb x11-utils libgl1-mesa-dri
      - name: Configure
        # DATADIR relative to the program, so that the AppImage finds its shaders,
        # scripts and game database
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          -DDATADIR=../share/mgba -DBUILD_SHARED=OFF -DBUILD_STATIC=ON -DUSE_FFMPEG=OFF
          -DUSE_NETPLAY=ON -DFORCE_QT_VERSION=6
      - name: Build
        run: cmake --build build
      - name: Install into the AppDir
        run: |
          DESTDIR="$PWD/AppDir" cmake --install build --component mgba
          DESTDIR="$PWD/AppDir" cmake --install build --component mgba-qt
          # A DATADIR of ../share/mgba lands beside usr/; move it to where mgba-qt looks
          mv AppDir/share/mgba AppDir/usr/share/mgba
          rmdir AppDir/share
          find AppDir -type f | sort
      - name: Fetch AppImage tools
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod a+x linuxdeploy-*.AppImage
      - name: Build the AppImage
        env:
          EXTRA_PLATFORM_PLUGINS: libqwayland-egl.so;libqwayland-generic.so
          EXTRA_QT_PLUGINS: waylandcompositor
          QMAKE: /usr/lib/qt6/bin/qmake
          OUTPUT: mGBA-nightly-linux-x86_64.AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage \
            --executable AppDir/usr/bin/mgba-qt \
            --desktop-file AppDir/usr/share/applications/io.mgba.mGBA.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/io.mgba.mGBA.png
      - name: Check that the AppImage starts
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          QT_DEBUG_PLUGINS: 1
        run: |
          set -euo pipefail
          app="$PWD/mGBA-nightly-linux-x86_64.AppImage"
          ls -l "$app"
          echo "Netplay identity of linkstress-2p:"
          "$app" --netplay-identity tools/netplay/profiles/linkstress-2p.ini
          xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            "$0" > app.log 2>&1 &
            pid=$!
            sleep 15
            xwininfo -root -tree | grep -i "mgba" || { cat app.log; exit 1; }
            kill -0 "$pid" || { echo "mGBA exited"; cat app.log; exit 1; }
            kill "$pid" || true
            grep -i "platforms" app.log | head -n 20 || true' "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: mgba-linux-x86_64
          path: mGBA-nightly-linux-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows x86_64 (zip)
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep line endings as committed
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git zip
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base mingw-w64-x86_64-qt6-multimedia mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-translations mingw-w64-x86_64-sdl3 mingw-w64-x86_64-libzip
            mingw-w64-x86_64-lua mingw-w64-x86_64-json-c mingw-w64-x86_64-freetype mingw-w64-x86_64-libepoxy
            mingw-w64-x86_64-libelf mingw-w64-x86_64-libpng mingw-w64-x86_64-zlib mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-ntldd
      - name: Rename two names in the fork's code that clash with Windows headers
        # src/gba/sio/linkmachine.c defines a function _rotl64, which MinGW's stdlib.h
        # declares too, and src/platform/qt/netplay/NetplayWindow.cpp a constant GROUP,
        # which winsock2.h declares as a type. Until the source renames them, this step
        # does, in the build's copy only. Marking the two files unchanged keeps the
        # build's version, and so its netplay identity, equal to the other platforms'.
        run: |
          sed -i 's/\b_rotl64\b/_linkHashRotl64/g' src/gba/sio/linkmachine.c
          sed -i 's/\bGROUP\b/SETTINGS_GROUP/g' src/platform/qt/netplay/NetplayWindow.cpp
          git update-index --assume-unchanged src/gba/sio/linkmachine.c src/platform/qt/netplay/NetplayWindow.cpp
      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED=OFF -DBUILD_STATIC=ON
          -DUSE_FFMPEG=OFF -DUSE_NETPLAY=ON -DFORCE_QT_VERSION=6
      - name: Build
        run: cmake --build build
      - name: Install and deploy the DLLs
        run: |
          set -euo pipefail
          # MSYS2 keeps Qt 6's windeployqt without a suffix in share/qt6/bin
          command -v windeployqt > /dev/null || export PATH="$MINGW_PREFIX/share/qt6/bin:$PATH"
          out="$PWD/dist/mGBA"
          # The install runs tools/deploy-win.sh, which finds nothing to deploy here: it looks
          # for build/qt/mGBA.exe, and it passes Qt 5's --no-svg to Qt 6's windeployqt. Its
          # two steps, windeployqt and the MinGW DLLs, follow below.
          cmake --install build --component mgba --prefix "$out"
          cmake --install build --component mgba-qt --prefix "$out"
          windeployqt --no-opengl-sw --release --dir "$out" "$out/mGBA.exe"
          # Qt Multimedia's FFmpeg plugin would need all of FFmpeg's DLLs; without it,
          # Qt uses its Windows media plugin
          rm -f "$out"/multimedia/ffmpegmediaplugin.dll
          # The MinGW DLLs that the program and Qt's plugins load
          find "$out" -name '*.exe' -o -name '*.dll' > binaries.txt
          : > ntldd.txt
          while read -r binary; do
            ntldd -R "$binary" >> ntldd.txt || true
          done < binaries.txt
          { grep -i mingw64 ntldd.txt || true; } | cut -d'>' -f2 \
            | sed -e 's/(0x[0-9a-f]\+)//' -e 's/^ \+//' -e 's/ \+$//' -e 's,\\,/,g' | sort -u > deps.txt
          while read -r dep; do
            [ -e "$out/$(basename "$dep")" ] || cp -v "$dep" "$out/"
          done < deps.txt
          find "$out" -type f | sort
      - name: Check that mGBA starts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Only Windows' own folders, so that every DLL must come from the package
          $env:PATH = 'C:\Windows\System32;C:\Windows'
          $exe = Join-Path $PWD 'dist\mGBA\mGBA.exe'
          # mGBA's paths use forward slashes on Windows too
          $p = Start-Process -FilePath $exe -ArgumentList '--netplay-identity', 'tools/netplay/profiles/linkstress-2p.ini' `
            -RedirectStandardOutput identity.txt -RedirectStandardError identity-err.txt -NoNewWindow -PassThru
          $null = $p.Handle  # keeps the exit code readable after the process ends
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'mGBA.exe did not exit (a missing DLL?)' }
          Write-Output 'Netplay identity of linkstress-2p:'
          Get-Content identity.txt, identity-err.txt
          if ($p.ExitCode -ne 0) { throw "mGBA.exe --netplay-identity failed with exit code $($p.ExitCode)" }
          $env:QT_DEBUG_PLUGINS = '1'
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $p = Start-Process -FilePath $exe -RedirectStandardError gui-err.txt -PassThru
          Start-Sleep -Seconds 20
          # List the program's windows and the text of its dialogs. Without a GPU, mGBA
          # shows a dialog saying that it falls back to its software display.
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $ae = [System.Windows.Automation.AutomationElement]
          $scope = [System.Windows.Automation.TreeScope]
          $byProcess = New-Object System.Windows.Automation.PropertyCondition($ae::ProcessIdProperty, $p.Id)
          $titles = @()
          foreach ($w in $ae::RootElement.FindAll($scope::Children, $byProcess)) {
            $titles += $w.Current.Name
            Write-Output "Window: '$($w.Current.Name)'"
            foreach ($e in $w.FindAll($scope::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) {
              if ($e.Current.ControlType -eq [System.Windows.Automation.ControlType]::Text) { Write-Output "  $($e.Current.Name)" }
            }
          }
          $running = -not $p.HasExited
          if ($running) { Stop-Process -Id $p.Id -Force }
          Get-Content gui-err.txt | Select-String -Pattern 'qwindows' | Select-Object -First 5
          if (-not $running) { throw 'mGBA exited' }
          if (-not ($titles | Where-Object { $_ -like 'mGBA*' })) { throw 'mGBA did not open its main window' }
      - name: Zip
        run: |
          cd dist
          zip -r -9 ../mGBA-nightly-windows-x86_64.zip mGBA
      - uses: actions/upload-artifact@v4
        with:
          name: mgba-windows-x86_64
          path: mGBA-nightly-windows-x86_64.zip
          if-no-files-found: error

  macos:
    name: macOS arm64 (zipped app)
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install ninja pkgconf qt sdl3 libzip lua json-c freetype libpng
      - name: Configure
        # mGBA's CMake sets a macOS 10.6 or 10.7 deployment target for the code outside
        # the Qt frontend, GekkoNet included, and libc++ then refuses std::visit, which
        # macOS has had since 10.13. The Homebrew libraries need the runner's macOS
        # version anyway, so turn off libc++'s availability checks.
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
          -DCMAKE_CXX_FLAGS=-D_LIBCPP_DISABLE_AVAILABILITY
          -DBUILD_SHARED=OFF -DBUILD_STATIC=ON -DUSE_FFMPEG=OFF -DUSE_NETPLAY=ON -DFORCE_QT_VERSION=6
      - name: Build
        run: cmake --build build
      - name: Bundle the app
        run: |
          set -euo pipefail
          mkdir dist
          cp -R build/qt/mGBA.app dist/
          # The data files that "cmake --install" would add to the bundle
          res=dist/mGBA.app/Contents/Resources
          mkdir -p "$res/shaders"
          cp build/qt/shaders/*.shader "$res/shaders/"
          cp -R res/scripts "$res/"
          cp res/nointro.dat "$res/"
          # Copy Qt, its plugins and the Homebrew libraries into the bundle
          "$(brew --prefix qt)/bin/macdeployqt" dist/mGBA.app -verbose=1
          # macdeployqt misses some libraries that other Homebrew libraries load (such
          # as brotli for freetype); copy those too and point their users at the copies
          fw=dist/mGBA.app/Contents/Frameworks
          for pass in 1 2 3 4 5; do
            changed=0
            while IFS= read -r f; do
              # A copied library may still carry its Homebrew path as its own name
              id="$(otool -D "$f" 2> /dev/null | sed -n 2p)"
              case "$id" in
                /opt/homebrew/*|/usr/local/*)
                  install_name_tool -id "@executable_path/../Frameworks/$(basename "$id")" "$f"
                  changed=1 ;;
              esac
              for dep in $(otool -L "$f" | awk 'NR > 1 { print $1 }' | grep -E '^(/opt/homebrew|/usr/local)/.*\.dylib$' || true); do
                [ "$dep" = "$id" ] && continue
                name="$(basename "$dep")"
                if [ ! -e "$fw/$name" ]; then
                  cp "$dep" "$fw/$name"
                  chmod u+w "$fw/$name"
                  install_name_tool -id "@executable_path/../Frameworks/$name" "$fw/$name"
                fi
                echo "$f: $dep"
                install_name_tool -change "$dep" "@executable_path/../Frameworks/$name" "$f"
                changed=1
              done
            done < <(find dist/mGBA.app -type f \( -perm +111 -o -name '*.dylib' \))
            [ "$changed" = 0 ] && break
          done
          codesign --force --deep --sign - dist/mGBA.app
          find dist/mGBA.app -type f | sort
      - name: Check that mGBA starts
        run: |
          set -euo pipefail
          app=dist/mGBA.app
          # Every library must come from the bundle or the system, not from Homebrew
          refs="$(find "$app" -type f \( -perm +111 -o -name '*.dylib' \) -exec otool -L {} + 2> /dev/null || true)"
          if grep -E '^[[:space:]]+(/opt/homebrew|/usr/local)' <<< "$refs"; then
            echo "The bundle still refers to Homebrew's libraries"
            exit 1
          fi
          # The oldest macOS that the program and the bundled Qt declare
          vtool -show-build "$app/Contents/MacOS/mGBA" | grep -E 'minos' || true
          vtool -show-build "$app/Contents/Frameworks/QtCore.framework/Versions/A/QtCore" | grep -E 'minos' || true
          echo "Netplay identity of linkstress-2p:"
          "$app/Contents/MacOS/mGBA" --netplay-identity tools/netplay/profiles/linkstress-2p.ini
          QT_DEBUG_PLUGINS=1 "$app/Contents/MacOS/mGBA" > app.log 2>&1 &
          pid=$!
          sleep 20
          grep -i "cocoa" app.log | head -n 10 || true
          kill -0 "$pid" || { cat app.log; exit 1; }
          kill "$pid" || true
      - name: Zip
        run: |
          cd dist
          ditto -c -k --keepParent mGBA.app ../mGBA-nightly-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mgba-macos-arm64
          path: mGBA-nightly-macos-arm64.zip
          if-no-files-found: error

  publish:
    name: Publish the nightly release
    needs: [check, linux, windows, macos]
    # A scheduled run is always on the default branch (its event carries no
    # repository details); other runs publish only from the default branch.
    if: >
      needs.check.outputs.build == 'true' &&
      (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Write checksums
        working-directory: packages
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Move the nightly tag to this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA"
          fi
      - name: Recreate the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Deleting the release keeps the tag, which now points to this commit
          if gh release view nightly --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes
          fi
          cat > notes.md <<EOF
          Nightly build of $GITHUB_REPOSITORY at commit [${GITHUB_SHA:0:12}]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA), $(date -u '+%Y-%m-%d %H:%M') UTC.

          This is an automatic build of the default branch, not a stable release.
          EOF
          gh release create nightly packages/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --prerelease --latest=false --title "Nightly build" --notes-file notes.md
