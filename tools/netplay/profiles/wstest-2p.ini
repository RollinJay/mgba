; wstest-2p
; Widescreen in a session (doc/widescreen.md): GBA 1 runs the widescreen test ROM, whose
; picture is 320x200; GBA 2 runs the link stress ROM at the GBA's own 240x160. Every
; screen is shown, so the window holds pictures of two sizes.

[profile]
name = wstest-2p
gbas = 2
link = 1
screens = all
rom.1 = ../../widescreen/testrom/wstest.gba
rom.2 = ../testrom/linkstress.gba

[player.1]
gba = 1
input = keypad

[player.2]
gba = 2
input = keypad

[intro]
1 = 60
