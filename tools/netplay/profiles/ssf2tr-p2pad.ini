; ssf2tr-p2pad
; p2pad on GBA 1 (the cable's small plug) and the p2join-patched game on GBA 2, linked:
; Player 2's keys travel over the emulated cable in Normal mode. The intro starts an Arcade
; match and Player 2 joins with START.

[profile]
name = ssf2tr-p2pad
gbas = 2
link = 1
rom.1 = ${P2PAD_ROM}
rom.2 = ${SSF2TR_P2JOIN_ROM}
save.2 = ${SSF2TR_SAVE}

[player.1]
gba = 2
input = keypad

[player.2]
gba = 1
input = keypad

[intro]
1 = 600
2 = 3: START
3 = 60
4 = 3: START
5 = 60
6 = 180
7 = 3: A
8 = 10
9 = 300
10 = 3: A
11 = 10
12 = 540
13 = 3: A
14 = 10
15 = 630
16 = 100
17 = 3: ,START
18 = 10
