; ssf2tr-hotseat
; Super Street Fighter II Turbo Revival with the p2join patch: one GBA; Player 2's keys go
; to the patch's mailbox. The intro starts an Arcade match and Player 2 joins with START.

[profile]
name = ssf2tr-hotseat
gbas = 1
link = 0
rom = ${SSF2TR_P2JOIN_ROM}
save = ${SSF2TR_SAVE}

[player.1]
gba = 1
input = keypad

[player.2]
gba = 1
input = mailbox
mailbox = 0x0203FF00
keysOffset = 0x2
markerOffset = 0x0
marker = 0x3250

[intro]
1 = 600
2 = 3: START
3 = 60
4 = 3: START
5 = 60
6 = 180
7 = 3: A
8 = 10
9 = 300
10 = 3: A
11 = 10
12 = 540
13 = 3: A
14 = 10
15 = 630
16 = 100
17 = 3: ,START
18 = 10
