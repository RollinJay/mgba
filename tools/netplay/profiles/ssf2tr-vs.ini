; ssf2tr-vs
; Super Street Fighter II Turbo Revival (USA), V.S. mode over the link cable: one GBA per
; player. The intro selects V.S. on both GBAs, waits for the link, picks Ryu and E. Honda
; and starts the fight.

[profile]
name = ssf2tr-vs
gbas = 2
link = 1
rom = ${SSF2TR_ROM}
save = ${SSF2TR_SAVE}

[player.1]
gba = 1
input = keypad

[player.2]
