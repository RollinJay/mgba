; mksc-4p
; Mario Kart: Super Circuit (USA), four players in a VS race over a Multi-Pak link: one
; GBA per player, each running the game. The intro selects Multiplayer and Multi-Pak Link
; on every GBA, VS at 50cc, picks Mario, Luigi, Yoshi and Wario, and starts a race on
; Peach Circuit.

