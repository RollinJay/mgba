; linkstress-2p
; Test ROM on two linked GBAs that keeps the cable busy in multiplayer and Normal mode;
; each player's keys go to their GBA and through the cable

[profile]
name = linkstress-2p
gbas = 2
link = 1
rom = ../testrom/linkstress.gba

[player.1]
gba = 1
input = keypad

[player.2]
gba = 2
input = keypad

[intro]
1 = 60
